name: Publish (RigelBuild)

# Fork-owned publish for @rigelbuild/solid-virtual. Upstream release.yml is
# gated `if: github.repository_owner == 'TanStack'` and stays untouched
# (upstreamable); this workflow is gated to the fork owner and publishes only
# the one renamed package via a direct filtered `pnpm publish`, computing the
# dist-tag from the version (prerelease -> next, GA -> latest). It reuses the
# monorepo install/build/test tooling; only the changesets *publish step* is
# bypassed, since it cannot scope a single renamed package's publish here.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*.*.*-rigel.*'
  workflow_dispatch:

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout workflow ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Fetch release branch
        if: github.event_name == 'push'
        run: git fetch --no-tags origin rigel-release:refs/remotes/origin/rigel-release
      - name: Resolve and validate release tag
        id: resolve
        run: node .github/scripts/resolve-release-source.mjs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
  publish:
    needs: [resolve]
    if: github.repository_owner == 'RigelBuild' && needs.resolve.outputs.publish == 'true'
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # No provenance attestation is generated (see the publish step's
      # pnpm_config_provenance=false), so no OIDC token is minted and the job
      # needs no id-token:write — read is the whole grant, matching the
      # @rigelbuild/solid-markdown precedent. Auth is the NPM_TOKEN secret.
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Tools
        uses: tanstack/config/.github/setup@e4b48f16568324f76f467aa4c2aac2f05db632c3 # main
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
      - name: Build and test the workspace
        # `test:ci` = nx run-many (not `affected`): a tag push has no affected
        # base, so `affected` would run nothing and could publish an unbuilt
        # dist. run-many runs every package's checks + the `build` target in
        # dependency order (virtual-core before solid-virtual), so the dist
        # this job publishes is freshly built and verified. Mirrors pr.yml.
        run: pnpm run test:ci
      - name: Resolve npm dist-tag from version
        id: disttag
        run: |
          version=$(node -p "require('./packages/solid-virtual/package.json').version")
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish @rigelbuild/solid-virtual
        # Auth is the NPM_TOKEN secret (custodied via the orion Pulumi github
        # stack per DL-015), not OIDC trusted publishing — hence the ignored
        # use-trusted-publishing audit on the publish line. pnpm 11 reads the
        # per-registry _authToken from the user-level ~/.npmrc; the token is
        # written there rather than passed as a config env var because a
        # URL-scoped pnpm config key (//registry.npmjs.org/:_authToken) cannot
        # be a GitHub Actions env-var name (names are [A-Za-z0-9_] only), so
        # the value would never reach pnpm and the scoped publish would go out
        # unauthenticated — which npm answers with a 404 on the PUT. The token
        # is passed via the clean-named NPM_TOKEN env and never interpolated
        # into the command line (zizmor template-injection).
        run: | # zizmor: ignore[use-trusted-publishing]
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is empty — cannot authenticate the publish" >&2
            exit 1
          fi
          # Create the user npmrc mode-600 at creation (umask in a subshell), so
          # the token file is never briefly world-readable.
          ( umask 077 && printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc" )
          pnpm publish --filter @rigelbuild/solid-virtual --tag "$TAG" --no-git-checks
        env:
          TAG: ${{ steps.disttag.outputs.tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Force npm provenance OFF: repository.url points at upstream
          # TanStack/virtual per DL-015, which would 422 a provenance upload
          # from the RigelBuild/virtual publishing repo. pnpm 11 reads
          # provenance only from this env key, never from any .npmrc; the
          # clean name exports fine in Actions.
          pnpm_config_provenance: 'false'
